{% extends 'blog/base.html' %} {% block content %}

<h1>Blog Posts</h1>

{% for post in posts %}

<div class="card mb-3">
  <div class="card-body">
    <h4>{{ post.title }}</h4>

    <p>{{ post.content|truncatewords:20 }}</p>

    <a href="{% url 'post_detail' post.id %}" class="btn btn-primary"
      >Read More
    </a>
  </div>
</div>

{% endfor %} {% endblock %}
