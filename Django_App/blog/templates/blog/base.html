<DOCTYPE html>
  <html>
    <head>
      <title>INF601 Blog</title>

      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
      />
    </head>

    <body>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="{% url 'home' %}"> INF601 Blog </a>

          <div>
            <a class="btn btn-right" href="{% url 'posts' %}"> Posts </a>

            <a class="btn btn-light" href="{% url 'contact' %}"> Contact </a>

            {% if user.is_authenticated %}

            <a class="btn btn-success" href="{% url 'create_post' %}">
              New Post
            </a>

            <form
              action="{% url 'logout' %}"
              method="post"
              style="display: inline"
            >
              {% csrf_token %}
              <button type="submit" class="btn btn-danger">Logout</button>
            </form>

            {% else %}

            <a class="btn btn-primary" href="{% url 'login' %}"> Login </a>

            <a class="btn btn-warning" href="{% url 'register' %}">
              Register
            </a>

            {% endif %}
          </div>
        </div>
      </nav>

      <div class="container mt-4">{% block content %} {% endblock %}</div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
  </html>
</DOCTYPE>
